#      - reports/metrics/history_h${model.hidden_size}_seed${training.seed}.json


  evaluate:
    cmd: python -m scripts.dvc_stages.evaluate
    deps:
      - scripts/dvc_stages/evaluate.py
      - src/models/ae_lstm.py
      - src/models/weights/${model.path}
      - data/processed/features/val_scaled.npy
      - src/utils/FastTensorDataLoader.py
      - src/utils/evaluator.py
    params:
      - model.path
      - model.hidden_size
      - model.latent_dim
      - model.sequence_length
      - model.sequence_step
      - model.num_features
      - training.batch_size
      - training.epochs
      - detection.percentile
    outs:
      - plots/reconstruction_error_h${model.hidden_size}_e${training.epochs}.svg:
          cache: false
      - reports/metrics/threshold.json:
          cache: false


  train_iforest:
    cmd: python -m scripts.dvc_stages.train_iforest
    deps:
      - scripts/dvc_stages/train_iforest.py
      - src/models/isolation_forest.py
      - data/processed/features/train_scaled.npy
    params:
      - model.sequence_length
      - model.sequence_step
      - training.seed
      - iforest.path
      - iforest.n_estimators
      - iforest.max_samples
      - iforest.contamination
      - iforest.max_features
      - iforest.feature_mode
    outs:
      - src/models/weights/${iforest.path}


  evaluate_iforest:
    cmd: python -m scripts.dvc_stages.evaluate_iforest
    deps:
      - scripts/dvc_stages/evaluate_iforest.py
      - src/models/isolation_forest.py
      - src/models/weights/${iforest.path}
      - data/processed/features/val_scaled.npy
    params:
      - model.sequence_length
      - model.sequence_step
      - detection.percentile
      - iforest.path
      - iforest.n_estimators
      - iforest.feature_mode
    outs:
      - plots/iforest_validation_score_n${iforest.n_estimators}.svg:
          cache: false
      - reports/metrics/iforest_threshold.json:
          cache: false


  generate_attack:
    foreach:
      - dos
      - replay
      - payload
      - frequency
      - fuzzing
      - suspension
      - multi
    do:
      cmd: python -m scripts.dvc_stages.generate_attack attacks.active_scenario=${item}
      deps:
        - scripts/dvc_stages/generate_attack.py
        - config.py
        - src/utils/attacks/common.py
        - src/utils/attacks/dos.py
        - src/utils/attacks/replay.py
        - src/utils/attacks/payload.py
        - src/utils/attacks/frequency.py
        - src/utils/attacks/fuzzing.py
        - src/utils/attacks/suspension.py
        - data/raw/${parsing.raw_file}
      params:
        - parsing.raw_file
        - preprocessing.train_ratio
        - preprocessing.val_ratio
        - attacks.${item}
      outs:
        - data/processed/attacks/${item}_attack.log
        - data/processed/attacks/${item}_labels.npy


  preprocess_attack:
    foreach:
      - dos
      - replay
      - payload
      - frequency
      - fuzzing
      - suspension
      - multi
    do:
      cmd: python -m scripts.dvc_stages.preprocess_attack attacks.active_scenario=${item}
      deps:
        - scripts/dvc_stages/preprocess_attack.py
        - config.py
        - src/utils/raw_data_parser.py
        - src/utils/feature_prep/scale_features.py
        - data/processed/attacks/${item}_attack.log
        - data/processed/attacks/${item}_labels.npy
        - src/models/scalers/bytes_scaler.pkl
        - src/models/scalers/time_scaler.pkl
        - src/models/scalers/feature_columns.json
      outs:
        - data/processed/attacks/${item}_scaled.npy


  evaluate_attack:
    foreach:
      - dos
      - replay
      - payload
      - frequency
      - fuzzing
      - suspension
      - multi
    do:
      cmd: python -m scripts.dvc_stages.evaluate_attack attacks.active_scenario=${item}
      deps:
        - scripts/dvc_stages/evaluate_attack.py
        - src/utils/evaluate_attack.py
        - config.py
        - src/utils/evaluator.py
        - src/utils/FastTensorDataLoader.py
        - src/models/ae_lstm.py
        - src/models/weights/${model.path}
        - reports/metrics/threshold.json
        - data/processed/attacks/${item}_scaled.npy
        - data/processed/attacks/${item}_labels.npy
      params:
        - model.path
        - model.hidden_size
        - model.latent_dim
        - model.sequence_length
        - model.num_features
        - training.batch_size
        - training.epochs
        - detection.persistence_k
        - attacks.eval_stride
      outs:
        - plots/${item}_attack_reaction_h${model.hidden_size}_e${training.epochs}.svg:
            cache: false
      metrics:
        - reports/metrics/${item}_metrics.json:
            cache: false


  evaluate_attack_iforest:
    foreach:
      - dos
      - replay
      - payload
      - frequency
      - fuzzing
      - suspension
      - multi
    do:
      cmd: python -m scripts.dvc_stages.evaluate_attack_iforest attacks.active_scenario=${item}
      deps:
        - scripts/dvc_stages/evaluate_attack_iforest.py
        - src/models/isolation_forest.py
        - src/utils/evaluate_attack.py
        - config.py
        - src/models/weights/${iforest.path}
        - reports/metrics/iforest_threshold.json
        - data/processed/attacks/${item}_scaled.npy
        - data/processed/attacks/${item}_labels.npy
      params:
        - model.sequence_length
        - detection.persistence_k
        - attacks.eval_stride
        - iforest.path
        - iforest.n_estimators
        - iforest.feature_mode
      outs:
        - plots/iforest_${item}_attack_reaction_n${iforest.n_estimators}.svg:
            cache: false
      metrics:
        - reports/metrics/iforest_${item}_metrics.json:
            cache: false


  compare_models:
    cmd: python -m scripts.dvc_stages.compare_models
    deps:
      - scripts/dvc_stages/compare_models.py
      - config.py
      - reports/metrics/dos_metrics.json
      - reports/metrics/replay_metrics.json
      - reports/metrics/payload_metrics.json
      - reports/metrics/frequency_metrics.json
      - reports/metrics/fuzzing_metrics.json
      - reports/metrics/suspension_metrics.json
      - reports/metrics/multi_metrics.json
      - reports/metrics/iforest_dos_metrics.json
      - reports/metrics/iforest_replay_metrics.json
      - reports/metrics/iforest_payload_metrics.json
      - reports/metrics/iforest_frequency_metrics.json
      - reports/metrics/iforest_fuzzing_metrics.json
      - reports/metrics/iforest_suspension_metrics.json
      - reports/metrics/iforest_multi_metrics.json
    params:
      - detection.persistence_k
    outs:
      - plots/model_comparison_ae_lstm_vs_iforest.svg:
          cache: false
    metrics:
      - reports/metrics/model_comparison.json:
          cache: false
