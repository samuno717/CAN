  evaluate:
    cmd: python -m scripts.dvc_stages.evaluate
    deps:
      - scripts/dvc_stages/evaluate.py
      - src/models/ae_lstm.py
      - data/processed/features/val_scaled.npy
      - src/utils/FastTensorDataLoader.py
      - src/utils/evaluator.py
      - src/models/weights/ae_lstm_can_model_h${model.hidden_size}_e${training.epochs}.pth
    params:
      - model.hidden_size
      - model.sequence_length
      - model.num_features
      - training.batch_size
      - detection.percentile
    outs:
      - reports/metrics/dos_eval_metrics_p${detection.persistence_k}.json
      - plots/reconstruction_error_h${model.hidden_size}_e${training.epochs}.svg


  generate_dos:
    cmd: python -m scripts.dvc_stages.generate_dos
    deps:
      - scripts/dvc_stages/generate_dos.py
      - src/attacks/dos_generator.py
      - data/processed/tensors/tensors_val.npy
    params:
      - attacks.dos.start_row
      - attacks.dos.duration_rows
      - attacks.dos.target_id_col
    outs:
      - attacks/dos_tensors.npy
      - attacks/dos_labels.npy

  evaluate_dos:
    cmd: python -m scripts.dvc_stages.evaluate_dos
    deps:
      - scripts/dvc_stages/evaluate_dos.py
      - src/models/ae_lstm.py
      - src/utils/EcuDataset.py
      - src/utils/evaluate_attack.py
      - attacks/dos_tensors.npy
      - attacks/dos_labels.npy
      - reports/metrics/threshold.json
    params:
      - model.hidden_size
      - model.sequence_length
      - model.num_features
      - training.batch_size
    outs:
      - reports/metrics/dos_metrics_h${model.hidden_size}.json
      - plots/dos_attack_reaction_ir${attacks.dos.injection_ratio}.png

