stages:
  parse_data:
    cmd: python -m scripts.dvc_stages.data_parse
    deps:
      - scripts/dvc_stages/data_parse.py
      - src/utils/raw_data_parser.py
      - data/raw/candump-2026-04-28_162402.log
    outs:
      - data/processed/processed_data.csv


  preprocess_features:
    cmd: python -m scripts.dvc_stages.preprocess_features
    deps:
      - scripts/dvc_stages/preprocess_features.py
      - src/utils/feature_prep/preprocess.py
      - src/utils/feature_prep/scale_features.py
      - data/processed/processed_data.csv
    params:
      - data_split.train_ratio
      - data_split.val_ratio
    outs:
      - src/models/scalers/bytes_scaler.pkl
      - src/models/scalers/time_scaler.pkl
      - data/processed/features/train_scaled.npy
      - data/processed/features/val_scaled.npy
      - data/processed/features/test_scaled.npy


  train:
    cmd: python -m scripts.dvc_stages.train
    deps:
      - scripts/dvc_stages/train.py
      - src/models/ae_lstm.py
      - src/utils/trainer.py
      - src/utils/FastTensorDataLoader.py
      - data/processed/features/train_scaled.npy
    params:
      - model.sequence_length
      - model.sequence_step
      - model.hidden_size
      - model.latent_dim
      - model.num_features
      - training.seed
      - training.epochs
      - training.batch_size
      - training.learning_rate
    outs:
      - src/models/weights/ae_lstm_can_model_h${model.hidden_size}_e${training.epochs}.pth
      - plots/training_loss_history/train_loss_h${model.hidden_size}_seed${training.seed}.svg
      - reports/metrics/history_h${model.hidden_size}_seed${training.seed}.json


