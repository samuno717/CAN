[project]
name = "can"
version = "0.1.0"
description = "CAN bus data IDS using LSTM/AE"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ipykernel",
    "matplotlib",
    "pandas==2.2.3",
    "scikit-learn",
    "tqdm",
    "numpy<2.0.0",
    "torch",
    "hydra-core>=1.3.2,<1.4.0",
    "dvc>=3.67.1",
    "loguru>=0.7.3",
    "psutil>=7.2.2",
    "nvidia-ml-py>=13.610.43",
]

[tool.uv]
prerelease = "allow"
environments = ["sys_platform == 'win32'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/nightly/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
