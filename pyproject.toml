[project]
name = "can"
version = "0.1.0"
description = "CAN bus data IDS using LSTM/AE"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ipykernel",
    "matplotlib",
    "pandas==2.2.3",
    "scikit-learn",
    "tqdm",
    "numpy<2.0.0",
    "torch",
    "torchvision",
    "torchaudio",
    "hydra-core>=1.3.4",
    "dvc>=3.67.1",
    "loguru>=0.7.3",
    "pathlib>=1.0.1",
    "omegaconf>=2.3.1",
    "psutil>=7.2.2",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
