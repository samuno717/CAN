# When it comes to pointing a file, just its name is enough

# STAGE 1: data_parse
parsing:
  raw_file: 'candump-2026-04-28_162402.log'
  output_file: 'processed_data.csv'

# STAGE 2: preprocess_features
preprocessing:
  processed_file: 'processed_data.csv'
  train_ratio: 0.70
  val_ratio: 0.15

model:
  path: 'ae_lstm_can_model_h64_e500.pth'
  sequence_length: 64
  sequence_step: 5
  hidden_size: 64
  latent_dim: 16
  num_features: 26

# STAGE 3: train
training:
  seed: 42
  epochs: 400
  batch_size: 4096
  learning_rate: 0.001

detection:
  percentile: 99.9
  persistence_k: 10

attacks:
  dos:
    start_row: 5000
    duration_rows: 300
    injection_ratio: 1
    delta_t_val: 0.05
    payload_val: 1.0        # 0xFF

