# When it comes to pointing a file, just its name is enough

# STAGE 1: data_parse
parsing:
  raw_file: 'candump-2026-04-28_162402.log'
  output_file: 'processed_data.csv'

# STAGE 2: preprocess_features
preprocessing:
  processed_file: 'processed_data.csv'
  train_ratio: 0.70
  val_ratio: 0.15

model:
  path: 'ae_lstm_can_model_h64_e500.pth'
  sequence_length: 64
  sequence_step: 5
  hidden_size: 64
  latent_dim: 16
  num_features: 26

# STAGE 3: train
training:
  seed: 42
  epochs: 400
  batch_size: 4096
  learning_rate: 0.001

detection:
  percentile: 99.9
  persistence_k: 10

attacks:
  active_scenario: 'multi' # choose from: multi, dos, replay
  eval_stride: 1

  dos:
    start_row: 5000
    duration_rows: 1000
    can_id_hex: '002'
    payload_hex: '0000000000000000'
    physical_delay: 0.00025

  replay:
    capture_start_row: 500
    start_row: 10000
    duration_rows: 30000
    target_can_id_hex: 'all'   # 'all' for multi-ECU block replay, or hex ID e.g. '130' for single-ECU replay
    speed_factor: 1.0
    min_bus_gap: 0.00020

  multi:
    steps:
      - type: 'dos'
        start_row: 5000
        duration_rows: 1000
        can_id_hex: '002'
        payload_hex: '0000000000000000'
        physical_delay: 0.00025
      - type: 'replay'
        capture_start_row: 500
        start_row: 11000
        duration_rows: 1000
        target_can_id_hex: 'all'
        speed_factor: 1.0
        min_bus_gap: 0.00020
